services:
  app:
    build: ./docker/php
    volumes:
      - ./src:/data
    entrypoint: >-
      sh -c "chown -R www-data:www-data /data/storage /data/bootstrap/cache &&
             chmod -R 775 /data/storage /data/bootstrap/cache &&
             php-fpm"
    depends_on:
      - db
      - redis

  web:
    image: nginx:1.29.5-alpine3.23
    ports:
      - "8080:80"
    volumes:
      - ./src:/data
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    working_dir: /data
    depends_on:
      - app

  db:
    image: postgres:15.17
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db-store:/var/lib/postgresql/data

  redis:
    image: redis:8.6.1
    ports:
      - "6379:6379"
    volumes:
      - redis-store:/data

  pgadmin:
    image: dpage/pgadmin4:9.13.0
    ports:
      - "5050:80"
    volumes:
      - pgadmin-store:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    depends_on:
      - db

  mail:
    image: axllent/mailpit:v1.29
    ports:
      - "19925:1025"
      - "19980:8025"
    volumes:
      - mailpit-store:/data
    environment:
      TZ: Asia/Tokyo
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  db-store:
  redis-store:
  pgadmin-store:
  mailpit-store:
