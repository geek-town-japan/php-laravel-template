services:
  app:
    build: ./docker/php
    volumes:
      - ./src:/data
    depends_on:
      - db
      - redis

  web:
    image: nginx:1.29.5-alpine3.23
    ports:
      - "8080:80"
    volumes:
      - ./src:/data
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    working_dir: /data
    depends_on:
      - app

  db:
    image: postgres:15.17
    restart: always
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - db-store:/var/lib/postgresql/data

  redis:
    image: redis:8.6.1
    ports:
      - "6379:6379"
    volumes:
      - redis-store:/data

  pgadmin:
    image: dpage/pgadmin4:9.13.0
    ports:
      - "5050:80"
    volumes:
      - pgadmin-store:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: pgadmin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    depends_on:
      - db

volumes:
  db-store:
  redis-store:
  pgadmin-store:
